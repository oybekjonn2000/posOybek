# ========================================================
# RESTAURANT POS API - APPLICATION PROPERTIES
# ========================================================

# Spring Application
spring.application.name=restaurant-pos-api

# Database DataSource
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/pos}
spring.datasource.username=${DATABASE_USERNAME:pos_user}
spring.datasource.password=${DATABASE_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.pool-name=POS-Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Security CORS
spring.security.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:3000}

# Cache
spring.cache.type=simple

# Jackson JSON
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Server Configuration
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.error.include-message=always
server.error.include-binding-errors=always

# JWT Authentication
app.jwt.secret=${JWT_SECRET:default-dev-secret-change-in-production-minimum-256-bits-long-key}
app.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Offline Sync Engine
app.sync.interval=${SYNC_INTERVAL:30000}
app.sync.batch-size=${SYNC_BATCH_SIZE:100}
app.sync.retry-delays=60000,300000,900000,1800000,3600000
app.sync.cloud-api-url=${CLOUD_API_URL:}
app.sync.cloud-api-key=${CLOUD_API_KEY:}

# Multi-Tenancy
app.tenant.id=${TENANT_ID:default}

# Device Identification
app.device.token-expiration=${DEVICE_TOKEN_EXPIRATION:31536000000}
app.device.id=${DEVICE_ID:}
app.device.name=${DEVICE_NAME:POS-01}
app.device.type=${DEVICE_TYPE:POS}

# Database Backup
app.backup.enabled=true
app.backup.path=${BACKUP_PATH:C:/ProgramData/RestaurantPOS/backups}
app.backup.schedule=${BACKUP_SCHEDULE:0 2 * * *}

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics,flyway
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.restaurantpos=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.file.name=${LOG_PATH:logs}/app.log
logging.file.max-size=50MB
logging.file.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{20} - %msg%n

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.default-produces-media-type=application/json
